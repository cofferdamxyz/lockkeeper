packages:
  - worker
  - dashboard
  - sample-api

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

# Patched versions of transitive development dependencies (Dependabot, 2026-10-11).
# braces has no patched release yet; it reaches us only through the shadcn CLI.
overrides:
  undici: ">=7.29.1"
  sharp: ">=0.35.5"
  # @cloudflare/vitest-pool-workers 0.23.0 (the latest) pins zod 4.4.3, under
  # GHSA alert 30 (fixed in 4.6.6); a test-only copy, moved to the 4.x the
  # worker already uses (2026-11-04). Drop it once the pool depends on 4.6.6+.
  "@cloudflare/vitest-pool-workers>zod": "^4.6.6"
