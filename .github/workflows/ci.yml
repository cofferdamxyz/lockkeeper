name: CI

# Checks on every push to main and on every pull request, drafts and
# Dependabot's included: delegated sessions open a draft PR at their first
# push (workspace decision 0013, amended 2026-10-20), and the Security bot
# clears a Dependabot pull request only after reading a green result comment
# (workspace docs/runbooks/agentic-loop-completion.md §1). Deploys run only
# from the founder's Mac (AGENTS.md); CI never deploys and holds no Cloudflare
# token. `pnpm check` runs `wrangler types` from wrangler.jsonc, which needs no
# account. There is no lint step: the repository has no linter.
on:
  push:
    branches: [main]
  pull_request:

# Dependabot's pull requests get a read-only GITHUB_TOKEN unless the workflow
# asks for more; pull-requests: write is what the result comment needs.
permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm's version comes from package.json packageManager.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - id: check
        run: pnpm check
      - id: test
        run: pnpm test
      - id: build
        run: pnpm build

      # On a pull request, one comment with the result of every step and the
      # run URL, updated in place on every run. The Cofferdam Development
      # Tracker in Cofferdam OS and the Security bot read pull request comments
      # and cannot read check runs, so this comment is how CI results reach
      # them. Needs only pull-requests: write on the GITHUB_TOKEN; no other
      # secret. Skipped for a pull request from a fork, whose token cannot
      # write (this repository is public).
      - name: Report the result on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          STEP_LABELS: |
            install=pnpm install --frozen-lockfile
            check=pnpm check
            test=pnpm test
            build=pnpm build
        with:
          script: |
            const marker = `<!-- cofferdam-ci:${context.job} -->`;
            const steps = JSON.parse(process.env.STEPS);
            const words = { success: '✅ pass', failure: '❌ fail', cancelled: '🚫 cancelled', skipped: '⏭️ skipped' };
            const rows = process.env.STEP_LABELS.trim().split('\n').map((line) => {
              const [id, ...label] = line.split('=');
              return { label: label.join('='), outcome: steps[id]?.outcome ?? 'skipped' };
            });
            // Passed only when the whole job succeeded and every listed step ran
            // and passed: a failed setup step skips them all, and four skipped
            // rows must never read as green.
            const failed = process.env.JOB_STATUS !== 'success' || rows.some((row) => row.outcome !== 'success');
            const sha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### CI ${failed ? '❌ failed' : '✅ passed'} · \`${context.job}\` on ${sha.slice(0, 7)}`,
              '',
              '| Step | Result |',
              '| --- | --- |',
              ...rows.map((row) => `| \`${row.label}\` | ${words[row.outcome] ?? row.outcome} |`),
              '',
              `[Run ${context.runId}, attempt ${process.env.GITHUB_RUN_ATTEMPT}](${runUrl})`,
            ].join('\n');
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
